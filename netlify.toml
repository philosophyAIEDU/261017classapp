# ─────────────────────────────────────────────
# Netlify 설정 파일 — 보통은 고치지 않아도 됩니다.
# GitHub 저장소를 Netlify에 연결하면 이 파일을 읽고 자동으로 빌드·배포합니다.
# ─────────────────────────────────────────────

[build]
  command = "npm run build"        # 화면(React) 빌드
  publish = "dist"                 # 빌드된 화면이 담기는 폴더
  functions = "netlify/functions"  # AI 서버 함수(feedback, tutor, check-key)

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# 내 컴퓨터에서 "npm run dev:ai" (= netlify dev) 로 실행할 때 설정
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# 새로고침하거나 주소를 직접 쳐도 React 화면이 열리도록
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 기본 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 빌드된 파일은 이름이 바뀌므로 오래 캐시해도 안전
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
