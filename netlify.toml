# Netlify 설정 파일 (4단계에서 다듬습니다)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# 새로고침해도 React 화면이 열리도록
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
